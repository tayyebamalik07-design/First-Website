<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TM web</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .container{
            box-shadow: inset 0 5px 15px gray , inset 0 -5px 15px wheat ;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            
        }
        .container h1{
            color: darkcyan;
            
        }
        .container2 a{
            text-decoration: none;
            color: black;
            font-size: 22px;
            margin: 0 15px;
            transition: 0.4s;
        }
        .container a:hover{
            color: yellow;
        }
        .container button{
            box-shadow: inset 0 5px 15px gray , inset 0 -5px 15px skyblue ;
            padding: 15px 25px;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            color: black;
            cursor: pointer;

        }
        .container button:hover{
            color: hotpink;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Navigation bar</h1>
        <div class="container2">
        <a href="">Home</a>
        <a href="">Contact</a>
        <a href="">Potfolo</a>
        <a href="">About</a>
        <button type="submit">Submit</button>
        <p>I am Malik</p>
</div>
    </div>
</body>
</html>
